version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tcg_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcg_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-tcg_vision_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcg_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tcg_prod_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: tcg_prod_api
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tcg_admin}:${POSTGRES_PASSWORD:-secure_prod_password_2026}@postgres:5432/${POSTGRES_DB:-tcg_vision_db}?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_prod_jwt_key_2026}
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: tcg_prod_web
    restart: always
    ports:
      - "3000:3000"

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    container_name: tcg_prod_admin
    restart: always
    ports:
      - "3001:3001"

  nginx:
    image: nginx:alpine
    container_name: tcg_prod_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - admin

volumes:
  postgres_prod_data:
  redis_prod_data:
