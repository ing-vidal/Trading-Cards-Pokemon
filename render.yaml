services:
  - type: web
    name: tcgvision-api
    env: node
    plan: free
    region: frankfurt
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter @tcg/api build
    startCommand: cd apps/api && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        value: "postgresql://postgres.mxrgynidlwddllhhzmuv:NWpr7TjIaZc1bBOW@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require"
      - key: REDIS_URL
        value: ""
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: API_URL
        value: https://trading-cards-pokemon.onrender.com
      - key: UPLOAD_DIR
        value: /opt/render/project/src/apps/api/storage/uploads
      - key: ALLOWED_ORIGINS
        value: https://trading-cards-pokemon-web.vercel.app,https://trading-cards-pokemon-admin.vercel.app
