services:
  - type: web
    name: tcgvision-api
    env: node
    plan: free
    region: frankfurt
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm prisma generate --schema=prisma/schema.prisma
      pnpm --filter @tcg/api build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: API_URL
        value: https://tcgvision-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://tcgvision-web.vercel.app,https://tcgvision-admin.vercel.app
