services:
  - type: web
    name: tcgvision-api
    env: node
    plan: free
    region: frankfurt
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter @tcg/api build
    startCommand: cd apps/api && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: API_URL
        value: https://trading-cards-pokemon.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://<tu-web>.vercel.app,https://<tu-admin>.vercel.app
